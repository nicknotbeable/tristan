<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IceHub Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
      
   
  <div class="container">
    <div class="left-panel">
      <img src="Icehub company.jpg" alt="Company Logo">
      <h2>Icehub Company</h2>
      <p>Powering cold chain solutions, one block at a time.</p>
    </div>

   
    <form id="loginForm" onsubmit="event.preventDefault(); loginUser();">
      <div class="mb-3">
        <label for="loginEmail" class="form-label fw-semibold">Email</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="loginPassword" class="form-label fw-semibold">Password</label>
        <input type="password" id="loginPassword" class="form-control" required>
      </div>

      <a href="forgot.html" class="forgot-link">Forgot Password?</a>
      <button type="submit" class="btn btn-success w-100 fw-bold">Sign In</button>
        <p class="create-account">You don't have an account? <a href="pass.html">Create Account</a></p>
</form>

  <footer>
    <p>&copy; 2026 IceHub. All rights reserved.</p>
  </footer>

  

</body>
<script src="loginScreen.js"></script>
</html>

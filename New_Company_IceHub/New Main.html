    <body>

    <section class="order-allocation">
        <h2>Log Store Order Allocation</h2>
        <form id="orderForm">
  
             <label for="clientName">Client Store Name</label>
        <input type="text" id="clientName" name="clientName"  placeholder="Enter client store name" required>

 
        <label for="branch">Fulfillment Branch</label>
            <select id="branch" name="branch">
        <option selected>North Depot Branch</option>
            <option>Main Plant Branch</option>
            <option>South Depot Branch</option>
        </select>

        <thead>
        <tr>
            <th>Store Client</th>
            <th>Target Branch</th>
            <th>Qty Ordered</th>
            <th>Inventory Action Status</th>
            <th>Action</th> <!-- new column -->
        </tr>
        </thead>


  
        <label for="quantity">Quantity Requested</label>
        <input type="number" id="quantity" name="quantity" placeholder="Enter quantity">

        <button type="submit">Dispatch Order</button>
    </section>

        <section class="allocation-log">
        <h2>Real-Time Allocation Log Registry</h2>
        <table id="logTable">
            <thead>
                    <tr>
                        <th>Store Client</th>
                        <th>Target Branch</th>
                        <th>Qty Ordered</th>
                        <th>Inventory Action Status</th>
                    </tr>
                </thead>
            <tbody>
        </tbody>
    </table>
</section>
